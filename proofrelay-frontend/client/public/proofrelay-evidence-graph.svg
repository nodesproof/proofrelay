<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Evidence graph: a claim fanning out to source evidence, checked by two independent verifiers, converging on a single settlement">
  <title>Evidence graph</title>
  <!-- Evidence Ledger palette. Ledger Ink #0D1721 ground, Storage Sky #A9D8FF for
       the evidence tier, Proof Citrus #C7F36B for the claim, the verifiers and the
       settlement. Object-fit: cover crops the flanks, so every node sits inside
       x 70..700; the bottom band is deliberately quiet because the caption sits there. -->
  <defs>
    <radialGradient id="settleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C7F36B" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#C7F36B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="claimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A9D8FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#A9D8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1721" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D1721" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0 L0 0 0 38" fill="none" stroke="#F4F1E8" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="760" height="520" fill="#0D1721"/>
  <rect width="760" height="520" fill="url(#grid)"/>

  <!-- the ledger's ring motif, echoing the sidebar -->
  <g fill="none" stroke="#C7F36B" stroke-opacity="0.10">
    <circle cx="104" cy="260" r="86"/>
    <circle cx="104" cy="260" r="124"/>
    <circle cx="676" cy="260" r="72"/>
  </g>

  <circle cx="676" cy="260" r="132" fill="url(#settleGlow)"/>
  <circle cx="104" cy="260" r="108" fill="url(#claimGlow)"/>

  <!-- tier 1 → tier 2: the claim fans out to the sources snapshotted for it -->
  <g fill="none" stroke="#A9D8FF" stroke-opacity="0.42" stroke-width="1.4">
    <path d="M133 260 C 196 260, 214 92, 287 92"/>
    <path d="M133 260 C 196 260, 214 176, 287 176"/>
    <path d="M133 260 C 200 260, 220 260, 287 260"/>
    <path d="M133 260 C 196 260, 214 344, 287 344"/>
    <path d="M133 260 C 196 260, 214 428, 287 428"/>
  </g>

  <!-- tier 2 → tier 3: every verifier reads the evidence independently -->
  <g fill="none" stroke="#C7F36B" stroke-opacity="0.34" stroke-width="1.4">
    <path d="M317 92 C 396 92, 424 178, 504 178"/>
    <path d="M317 176 C 396 176, 424 178, 504 178"/>
    <path d="M317 260 C 396 260, 424 178, 504 178"/>
    <path d="M317 260 C 396 260, 424 342, 504 342"/>
    <path d="M317 344 C 396 344, 424 342, 504 342"/>
    <path d="M317 428 C 396 428, 424 342, 504 342"/>
  </g>

  <!-- tier 3 → settlement: two independent verdicts converge on one payout -->
  <g fill="none" stroke="#C7F36B" stroke-opacity="0.75" stroke-width="2">
    <path d="M556 178 C 612 178, 604 260, 644 260"/>
    <path d="M556 342 C 612 342, 604 260, 644 260"/>
  </g>

  <!-- the claim -->
  <circle cx="104" cy="260" r="29" fill="#0D1721" stroke="#C7F36B" stroke-width="2.4"/>
  <circle cx="104" cy="260" r="9" fill="#C7F36B"/>

  <!-- the evidence tier: source snapshots held in storage -->
  <g fill="#0D1721" stroke="#A9D8FF" stroke-width="1.8">
    <rect x="288" y="79" width="27" height="27" rx="6"/>
    <rect x="288" y="163" width="27" height="27" rx="6"/>
    <rect x="288" y="247" width="27" height="27" rx="6"/>
    <rect x="288" y="331" width="27" height="27" rx="6"/>
    <rect x="288" y="415" width="27" height="27" rx="6"/>
  </g>
  <g fill="#A9D8FF" fill-opacity="0.85">
    <rect x="295" y="88" width="13" height="2" rx="1"/><rect x="295" y="94" width="9" height="2" rx="1"/>
    <rect x="295" y="172" width="13" height="2" rx="1"/><rect x="295" y="178" width="9" height="2" rx="1"/>
    <rect x="295" y="256" width="13" height="2" rx="1"/><rect x="295" y="262" width="9" height="2" rx="1"/>
    <rect x="295" y="340" width="13" height="2" rx="1"/><rect x="295" y="346" width="9" height="2" rx="1"/>
    <rect x="295" y="424" width="13" height="2" rx="1"/><rect x="295" y="430" width="9" height="2" rx="1"/>
  </g>

  <!-- the two verifiers -->
  <g fill="#0D1721" stroke="#C7F36B" stroke-width="2.2">
    <path d="M530 152 L552 165 L552 191 L530 204 L508 191 L508 165 Z"/>
    <path d="M530 316 L552 329 L552 355 L530 368 L508 355 L508 329 Z"/>
  </g>
  <g fill="none" stroke="#C7F36B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M522 178.5 L528 184.5 L539 172.5"/>
    <path d="M522 342.5 L528 348.5 L539 336.5"/>
  </g>

  <!-- settlement -->
  <circle cx="676" cy="260" r="32" fill="#C7F36B"/>
  <path d="M664 260.5 L672.5 269 L689 251" fill="none" stroke="#0D1721" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect y="392" width="760" height="128" fill="url(#floor)"/>
</svg>
